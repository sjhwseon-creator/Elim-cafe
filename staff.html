<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#7a4a28">
    <meta name="description" content="Elim Café staff order dashboard.">
    <title>Elim Café Staff</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/styles.css">
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="js/supabase-config.js"></script>
    <script defer src="js/staff.js"></script>
  </head>
  <body class="staff-page">
    <header class="app-header">
      <div>
        <p class="eyebrow">Tablet dashboard</p>
        <h1>Elim Café Staff</h1>
      </div>
      <div class="staff-header-actions">
        <a class="staff-link" href="index.html">Menu</a>
        <button id="staff-logout" class="secondary-button small-button" type="button" hidden>Log out</button>
      </div>
    </header>

    <main class="staff-layout">
      <section id="staff-login-panel" class="panel staff-login-panel" aria-labelledby="staff-login-heading">
        <p class="eyebrow">Staff access</p>
        <h2 id="staff-login-heading">Sign in to the dashboard</h2>
        <p>Enter the shared café staff email. Supabase will send a secure sign-in link.</p>
        <form id="staff-login-form">
          <label class="field">
            <span>Staff email</span>
            <input id="staff-email" type="email" autocomplete="email" inputmode="email" required placeholder="Staff email address">
          </label>
          <button id="send-magic-link" class="primary-button" type="submit">Send magic link</button>
        </form>
        <div id="login-message" class="form-message" role="status"></div>
      </section>

      <section id="staff-dashboard" class="panel dashboard-panel" aria-labelledby="orders-heading" hidden>
        <div class="section-heading">
          <div>
            <p class="eyebrow">Live orders</p>
            <h2 id="orders-heading">Incoming Orders</h2>
          </div>
          <button id="refresh-orders" class="secondary-button small-button" type="button">Refresh</button>
        </div>
        <div id="staff-message" class="form-message" role="status"></div>
        <div id="orders-list" class="orders-list empty-state">
          Waiting for orders...
        </div>
      </section>
    </main>
  </body>
</html>
